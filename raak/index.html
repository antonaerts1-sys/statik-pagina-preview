  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

position:relative;background:#06142b;height:clamp(200px,32vw,340px);overflow:hidden\">\n    <img src=\"a5e2b408-196a-4b8a-b280-d5d28dbdb1e2\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;object-position:center 27%;display:block\">\n    <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,22,47,0) 45%,rgba(7,22,47,.95) 100%)\"><\u002Fdiv>\n    <div style=\"position:absolute;left:0;right:0;bottom:18px;max-width:1000px;margin:0 auto;padding:0 20px\">\n      <div style=\"font-family:'Luckiest Guy',cursive;font-size:clamp(34px,6vw,56px);line-height:1;color:#fff;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.35)\">Bibber in {{gemeente}}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1000px;margin:0 auto;padding:24px 20px 8px\">\n    <div style=\"font-size:12px;font-weight:800;color:#13c7b5;letter-spacing:.54px;text-transform:uppercase\">Campagnemateriaal voor<\u002Fdiv>\n    <h1 style=\"margin:4px 0 8px;font-size:clamp(32px,5vw,48px);line-height:1.08;font-weight:700;color:#ffb52a;letter-spacing:-.96px;text-wrap:balance\">{{raakpunt}}<\u002Fh1>\n    <p style=\"margin:0;max-width:620px;color:rgba(255,255,255,.78);text-wrap:pretty\">{{intro}}<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1000px;margin:0 auto;padding:20px 20px 36px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start\">\n\n    <div data-screen-label=\"Nu aan de beurt\" style=\"flex:1 1 540px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n\n      <sc-if value=\"{{needRoute}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"background:#0b1d3c;border:2px solid #ffb52a;border-radius:15px;padding:20px 20px 22px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-size:12px;font-weight:800;color:#ffb52a;letter-spacing:.54px;text-transform:uppercase\">RAAK wacht hierop<\u002Fdiv>\n          <div style=\"font-size:24px;font-weight:700;line-height:1.2\">Stuur jullie routekaart<\u002Fdiv>\n          <p style=\"margin:0;color:rgba(255,255,255,.8);text-wrap:pretty\">Zonder kaartje van het parcours kunnen we jullie wegwijzers niet klaarmaken. Een foto van een plannetje op papier is genoeg.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n            <a href=\"{{routeMail}}\" style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:#ffb52a;color:#07162f;font-weight:700;text-decoration:none\">Mail de routekaart naar RAAK<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <div style=\"font-size:12px;font-weight:800;color:#13c7b5;letter-spacing:.54px;text-transform:uppercase\">{{todayLabel}}<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:clamp(28px,4vw,40px);line-height:1.1;font-weight:700;text-wrap:balance\">{{statusTitle}}<\u002Fh2>\n        <p style=\"margin:0;color:rgba(255,255,255,.75);text-wrap:pretty\">{{statusSub}}<\u002Fp>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{isSteps}}\" hint-placeholder-val=\"{{false}}\"><div style=\"display:flex;flex-direction:column;gap:6px\">\n        <div style=\"display:flex;justify-content:space-between;font-size:14px;color:rgba(255,255,255,.7)\"><span>{{progressLabel}}<\u002Fspan><span>{{progressPct}}<\u002Fspan><\u002Fdiv>\n        <div style=\"height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden\"><div style=\"height:100%;width:{{progressPct}};background:#13c7b5;border-radius:999px;transition:width .3s\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv><\u002Fsc-if>\n\n      <sc-for list=\"{{groups}}\" as=\"grp\" hint-placeholder-count=\"1\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-if value=\"{{grp.title}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"display:flex;flex-direction:column;gap:2px;margin-top:10px\">\n            <div style=\"font-size:22px;font-weight:700;line-height:1.2\">{{grp.title}}<\u002Fdiv>\n            <div style=\"font-size:14px;color:rgba(255,255,255,.65)\">{{grp.sub}}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{grp.tasks}}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div id=\"{{t.anchor}}\" style=\"background:#0b1d3c;border:1px solid rgba(255,255,255,.09);border-radius:15px;overflow:hidden\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px\">\n              <button sc-camel-on-click=\"{{t.toggleOpen}}\" style=\"flex:1;min-width:0;min-height:48px;background:none;border:0;padding:0;color:#fff;text-align:left;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:12px\">\n                <span style=\"flex:1;min-width:0;opacity:{{t.opacity}}\">\n                  <span style=\"display:block;font-size:18px;font-weight:700;line-height:1.25;text-decoration:{{t.strike}}\">{{t.title}}<\u002Fspan>\n                  <span style=\"display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:14px;color:rgba(255,255,255,.65)\"><span style=\"font-weight:700;color:{{t.whenColor}}\">{{t.when}}<\u002Fspan><span>{{t.duur}}<\u002Fspan><\u002Fspan>\n                <\u002Fspan>\n                <span style=\"flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;background:{{t.ctaBg}};color:{{t.ctaFg}};border:1px solid {{t.ctaBorder}};font-size:15px;font-weight:700;white-space:nowrap\">{{t.cta}}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{t.open}}\" hint-placeholder-val=\"{{false}}\">\n              <div style=\"padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px;border-top:1px solid rgba(255,255,255,.09)\">\n                <p style=\"margin:12px 0 0;color:rgba(255,255,255,.85);text-wrap:pretty\">{{t.body}}<\u002Fp>\n                <sc-if value=\"{{t.warn}}\" hint-placeholder-val=\"{{false}}\">\n                  <div style=\"border:1px solid #ffb52a;border-radius:12px;padding:12px 14px;font-size:15px;color:#ffd48a\">{{t.warn}}<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{t.hasChoice}}\" hint-placeholder-val=\"{{false}}\">\n                  <div style=\"display:flex;flex-direction:column;gap:8px\">\n                    <div style=\"font-weight:700\">Hoe maken jullie ze?<\u002Fdiv>\n                    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px\">\n                      <sc-for list=\"{{t.choices}}\" as=\"c\" hint-placeholder-count=\"2\">\n                        <button sc-camel-on-click=\"{{c.select}}\" style=\"min-height:64px;padding:12px 14px;border-radius:12px;border:2px solid {{c.border}};background:{{c.bg}};color:{{c.fg}};text-align:left;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px\">\n                          <span style=\"font-size:17px;font-weight:700\">{{c.label}}<\u002Fspan>\n                          <span style=\"font-size:14px;opacity:.8\">{{c.sub}}<\u002Fspan>\n                        <\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{t.choiceMade}}\" hint-placeholder-val=\"{{false}}\">\n                    <ol style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;color:rgba(255,255,255,.85)\">\n                      <sc-for list=\"{{t.steps}}\" as=\"st\" hint-placeholder-count=\"3\"><li style=\"padding-left:4px\">{{st}}<\u002Fli><\u002Fsc-for>\n                    <\u002Fol>\n                  <\u002Fsc-if>\n                <\u002Fsc-if>\n                <sc-if value=\"{{t.hasFiles}}\" hint-placeholder-val=\"{{false}}\">\n                  <div id=\"{{t.filesId}}\" style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px\">\n                      <a href=\"beelden/affiche.jpg\" download=\"{{t.files.0.download}}\" style=\"display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.14);color:#fff;text-decoration:none;background:rgba(255,255,255,.03)\">\n                        <img src=\"03f33da4-3f1a-4cf0-bae9-0db096ef182f\" alt=\"\" style=\"width:52px;height:72px;object-fit:cover;border-radius:4px;flex:none;background:#06142b\">\n                        <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                          <span style=\"font-weight:700\">{{t.files.0.name}}<\u002Fspan>\n                          <span style=\"font-size:13px;color:rgba(255,255,255,.65)\">{{t.files.0.meta}}<\u002Fspan>\n                          <span style=\"font-size:14px;font-weight:700;color:#ffb52a\">Download<\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fa>\n                      <a href=\"beelden/flyer-voorkant.jpg\" download=\"{{t.files.1.download}}\" style=\"display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.14);color:#fff;text-decoration:none;background:rgba(255,255,255,.03)\">\n                        <img src=\"6d4373f7-e831-4cc5-80ea-6b390e3eef58\" alt=\"\" style=\"width:52px;height:72px;object-fit:cover;border-radius:4px;flex:none;background:#06142b\">\n                        <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                          <span style=\"font-weight:700\">{{t.files.1.name}}<\u002Fspan>\n                          <span style=\"font-size:13px;color:rgba(255,255,255,.65)\">{{t.files.1.meta}}<\u002Fspan>\n                          <span style=\"font-size:14px;font-weight:700;color:#ffb52a\">Download<\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fa>\n                      <a href=\"beelden/flyer-achterkant.jpg\" download=\"{{t.files.2.download}}\" style=\"display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.14);color:#fff;text-decoration:none;background:rgba(255,255,255,.03)\">\n                        <img src=\"a3802607-8eea-4006-bf8d-a65be89bca99\" alt=\"\" style=\"width:52px;height:72px;object-fit:cover;border-radius:4px;flex:none;background:#06142b\">\n                        <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                          <span style=\"font-weight:700\">{{t.files.2.name}}<\u002Fspan>\n                          <span style=\"font-size:13px;color:rgba(255,255,255,.65)\">{{t.files.2.meta}}<\u002Fspan>\n                          <span style=\"font-size:14px;font-weight:700;color:#ffb52a\">Download<\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fa>\n                  <\u002Fdiv>\n                  <div style=\"display:flex\"><button sc-camel-on-click=\"{{t.downloadAll}}\" style=\"min-height:48px;padding:0 22px;border-radius:999px;border:0;background:#ffb52a;color:#07162f;font:inherit;font-weight:700;cursor:pointer\">{{t.downloadAllLabel}}<\u002Fbutton><\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{t.hasLink}}\" hint-placeholder-val=\"{{false}}\">\n                  <div style=\"display:flex\"><a href=\"{{t.linkHref}}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:#ffb52a;color:#07162f;font-weight:700;text-decoration:none\">{{t.linkLabel}}<\u002Fa><\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{t.hasMsg}}\" hint-placeholder-val=\"{{false}}\">\n                  <div style=\"display:flex;flex-direction:column;gap:10px\">\n                    <sc-if value=\"{{t.msg.isScholen}}\" hint-placeholder-val=\"{{false}}\">\n                      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px\">\n                        <label style=\"display:flex;flex-direction:column;gap:4px;font-size:14px;color:rgba(255,255,255,.75)\">Wie stuurt dit?\n                          <input value=\"{{t.msg.afzender}}\" sc-camel-on-change=\"{{t.msg.setAfzender}}\" placeholder=\"bv. Marleen, voor Raak Hamme H. Hart\" style=\"min-height:46px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#07162f;color:#fff;font:inherit;font-size:16px\">\n                        <\u002Flabel>\n                        <label style=\"display:flex;flex-direction:column;gap:4px;font-size:14px;color:rgba(255,255,255,.75)\">Waar kan men terecht met vragen?\n                          <input value=\"{{t.msg.contact}}\" sc-camel-on-change=\"{{t.msg.setContact}}\" placeholder=\"telefoon of e-mail\" style=\"min-height:46px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#07162f;color:#fff;font:inherit;font-size:16px\">\n                        <\u002Flabel>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"background:#fff;color:#171717;border-radius:12px;padding:16px;font-size:15px;line-height:1.5;word-break:break-word\">\n                      <sc-if value=\"{{t.msg.hasTitle}}\" hint-placeholder-val=\"{{false}}\"><div style=\"font-weight:700;margin-bottom:8px\">{{t.msg.title}}<\u002Fdiv><\u002Fsc-if>\n                      <div style=\"white-space:pre-wrap\"><sc-for list=\"{{t.msg.segs}}\" as=\"s\" hint-placeholder-count=\"1\"><span>{{s.plain}}<\u002Fspan><span>{{s.mark}}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                      <sc-if value=\"{{t.msg.isWa}}\" hint-placeholder-val=\"{{false}}\">\n                        <a href=\"{{t.msg.wa}}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:#ffb52a;color:#07162f;font-weight:700;text-decoration:none\">Open in WhatsApp<\u002Fa>\n                      <\u002Fsc-if>\n                      <button sc-camel-on-click=\"{{t.msg.copy}}\" style=\"min-height:48px;padding:0 22px;border-radius:999px;border:{{t.msg.copyBorder}};background:{{t.msg.copyBg}};color:{{t.msg.copyFg}};font:inherit;font-weight:700;cursor:pointer\">{{t.msg.copyLabel}}<\u002Fbutton>\n                      <sc-if value=\"{{t.msg.hasTitle}}\" hint-placeholder-val=\"{{false}}\">\n                        <button sc-camel-on-click=\"{{t.msg.copyTitle}}\" style=\"min-height:48px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font:inherit;font-weight:700;cursor:pointer\">{{t.msg.copyTitleLabel}}<\u002Fbutton>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{t.msg.isFb}}\" hint-placeholder-val=\"{{false}}\">\n                        <img src=\"03f33da4-3f1a-4cf0-bae9-0db096ef182f\" alt=\"\" data-dl-src=\"affiche\" style=\"display:none\"><a href=\"beelden/affiche.jpg\" data-dl=\"affiche\" download=\"bibber-affiche.jpg\" style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:700;text-decoration:none\">Bewaar het beeld<\u002Fa>\n                        <a href=\"{{t.msg.fb}}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:700;text-decoration:none\">Deel de link op Facebook<\u002Fa>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{canShare}}\" hint-placeholder-val=\"{{false}}\">\n                        <button sc-camel-on-click=\"{{t.msg.share}}\" style=\"min-height:48px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font:inherit;font-weight:700;cursor:pointer\">Delen via je telefoon<\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid rgba(255,255,255,.09)\">\n                  <a href=\"{{t.forward}}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;min-height:44px;color:#13c7b5;font-weight:700;text-decoration:none\">Iemand anders doet dit? Stuur het door<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div data-screen-label=\"Klopt dit\" style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n\n      <div style=\"background:#0b1d3c;border:1px solid rgba(255,255,255,.09);border-radius:15px;padding:18px 18px 8px\">\n        <div style=\"font-size:12px;font-weight:800;color:#13c7b5;letter-spacing:.54px;text-transform:uppercase\">Wat wij van jullie weten<\u002Fdiv>\n        <div style=\"font-size:22px;font-weight:700;margin:2px 0 6px\">Klopt dit?<\u002Fdiv>\n        <p style=\"margin:0 0 6px;font-size:14px;color:rgba(255,255,255,.7)\">Dit staat op jullie affiches, flyers en berichten.<\u002Fp>\n        <sc-for list=\"{{facts}}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"padding:14px 0;border-top:1px solid rgba(255,255,255,.09)\">\n            <div style=\"display:flex;gap:10px;align-items:flex-start\">\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:12px;font-weight:800;color:#13c7b5;letter-spacing:.54px;text-transform:uppercase\">{{r.label}}<\u002Fdiv>\n                <div style=\"font-weight:700;color:{{r.valueColor}}\">{{r.value}}<\u002Fdiv>\n                <div style=\"font-size:14px;color:rgba(255,255,255,.6)\">{{r.note}}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"padding:14px 0 10px;border-top:1px solid rgba(255,255,255,.09);font-size:14px;color:rgba(255,255,255,.7)\">Klopt er iets niet, of heb je een vraag? Mail <a href=\"mailto:info@raakvzw.be\">info@raakvzw.be<\u002Fa> of bel <a href=\"tel:022465252\">02 246 52 52<\u002Fa>.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;datum&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;24 sep (vandaag)&quot;,&quot;3 okt&quot;,&quot;13 okt&quot;,&quot;16 okt&quot;,&quot;25 okt&quot;,&quot;20 nov&quot;],&quot;default&quot;:&quot;3 okt&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Simulatie&quot;},&quot;routekaart&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Simulatie&quot;}}\">\nconst RP = {\n  \"Raakpunt\": \"Raak Hamme H. Hart\", \"Gemeente\": \"Hamme\",\n  \"Startdatum\": \"2026-10-17T00:00:00\", \"Einddatum\": \"2026-11-15T00:00:00\",\n  \"Naam vertrekpunt\": \"Zaal De Zouaaf\", \"Straatnaam + nummer\": \"Zouavenstraat 14 a\", \"Stad/ Gemeente\": \"Hamme\", \"Postcode\": \"9220\",\n  \"Eigen\": \"Ja\", \"Wat is de naam van jullie activiteit/tocht?\": \"Halloweentocht\",\n  \"Wanneer vindt jullie Halloweentocht plaats?\": \"2026-10-17T00:00:00\", \"Startuur\": \"19:00:00\",\n  \"Hoeveel kost het om deel te nemen?\": 10,\n  \"_landingspagina\": \"https://raakvzw.be/ga-je-mee-op-griezeltocht/Hamme-H-Hart\",\n  \"_routekaart_ingestuurd\": true\n};\nconst MAAND = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];\nconst DAG = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];\nconst d = s => new Date(s.slice(0,10) + 'T12:00:00');\nconst dm = x => `${x.getDate()} ${MAAND[x.getMonth()]}`;\nconst addDays = (x, n) => new Date(x.getTime() + n * 864e5);\nconst days = (a, b) => Math.round((b - a) / 864e5);\nconst DATES = { '24 sep (vandaag)': '2026-09-24', '3 okt': '2026-10-03', '13 okt': '2026-10-13', '16 okt': '2026-10-16', '25 okt': '2026-10-25', '20 nov': '2026-11-20' };\nconst PAGE = 'https://raakvzw.be/materiaal/' + RP._landingspagina.split('/').pop();\n\nconst MSG = {\n  wa: `👻 Op zoek naar een griezelig leuke gezinsactiviteit? 🎃\\n\\nDe Raak-audiowandeling Bibber in je Buurt strijkt ook neer in {g}! Volg de route, scan de QR-codes en luister samen naar een griezelverhaal met de stem van Walter De Donder.\\n\\nSpannend voor kinderen van 6 t/m 14 jaar, maar zeker niet té eng. 🕯️\\n\\n📅 Wanneer: {p}\\n✅ Gratis, zonder inschrijven\\n📍 Start: {s}\\n🔗 Info & route: {l}\\n\\nBibber je mee? 👻`,\n  hoplrTitle: 'Bibber in je Buurt: de spannende Raak-audiowandeling voor het hele gezin',\n  hoplr: `Op zoek naar een griezelig leuke gezinsactiviteit? De Raak-audiowandeling Bibber in je Buurt strijkt ook neer in {g}! Volg de route, scan de QR-codes en luister samen naar een griezelverhaal met de stem van Walter De Donder.\\n\\nSpannend voor kinderen van 6 t/m 14 jaar, maar zeker niet té eng.\\n\\n📅 Wanneer: {p} · ✅ Gratis, zonder inschrijven\\n📍 Start: {s} · 🔗 Info & route: {l}\\n\\nKen je buren met kinderen? Tag ze gerust in de reacties! 👥`,\n  fb: `👻 Bibber je mee? 🎃\\n\\nDit najaar organiseert Raak vzw een spannende audiowandeling in {g}.\\n\\nGa samen met je gezin op pad: scan de 7 borden op de route en ontdek stap voor stap een verhaal met de stem van Walter De Donder. Geschikt voor 6 t/m 14 jaar, en nooit té eng.\\n\\n📅 Wanneer: {p}\\n📍 Start: {s}\\n🔗 Info & route: {l}\\n\\n#BibberInJeBuurt #RaakVzw #Griezeltocht #Gezinsactiviteit #Audiowandeling #{h}`,\n  scholen: `Bibber in je Buurt: een spannende audiowandeling voor het hele gezin\\n\\nDit najaar organiseert Raak vzw in {g} de audiowandeling Bibber in je Buurt. Samen met je kinderen wandel je langs 7 borden. Scan de QR-codes en luister telkens naar een hoofdstuk van een mysterieus verhaal, verteld door Walter De Donder.\\n\\nJe legt de route af wanneer je wil en op je eigen tempo. Er is een versie voor de jongste durvers, en een versie voor griezelaars vanaf 10 jaar. Spannend, maar nooit té eng.\\n\\n📅 Wanneer: {p} · 📍 Start: {s}\\n🔗 Meer info en de volledige route: {l}\\n\\nWe wensen iedereen alvast veel wandelplezier!{x}`\n};\n\nclass Component extends DCLogic {\n  state = { druk: null, phase: null, open: {}, done: {}, copied: null, afzender: '', contact: '', routeFile: null, edit: {}, drafts: {}, sent: {}, confirmed: false };\n  componentDidMount() {\n    this._dl = e => {\n      const a = e.target.closest && e.target.closest('a[download]'); if (!a) return;\n      const img = a.querySelector('img') || (a.dataset.dl && document.querySelector('img[data-dl-src=\"' + a.dataset.dl + '\"]'));\n      if (img && img.currentSrc && img.currentSrc !== a.href) a.href = img.currentSrc;\n    };\n    document.addEventListener('click', this._dl, true);\n\n  }\n  setDone(id) {\n    const done = { ...this.state.done, [id]: !this.state.done[id] };\n    try { localStorage.setItem('raak-hamme-done', JSON.stringify(done)); } catch (e) {}\n    const open = { ...this.state.open }; if (done[id]) open[id] = false;\n    this.setState({ done, open });\n  }\n  copy(key, text) {\n    navigator.clipboard?.writeText(text).catch(() => {});\n    this.setState({ copied: key }); clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ copied: null }), 2000);\n  }\n  renderVals() {\n    const S = this.state, P = this.props;\n    const today = d(DATES[P.datum ?? '3 okt'] || '2026-10-03');\n    const start = d(RP.Startdatum), end = d(RP.Einddatum);\n    const g = RP.Gemeente, vp = RP['Naam vertrekpunt'];\n    const periode = `${dm(start)} t/m ${dm(end)}`;\n    const startloc = `${vp}, ${RP['Straatnaam + nummer']}, ${RP['Stad/ Gemeente']}`;\n    const eigen = RP.Eigen === 'Ja' ? { naam: RP['Wat is de naam van jullie activiteit/tocht?'], dag: d(RP['Wanneer vindt jullie Halloweentocht plaats?']), uur: RP.Startuur.slice(0,5) } : null;\n    const prijs = RP['Hoeveel kost het om deel te nemen?'];\n    const prijsTxt = typeof prijs === 'number' ? (prijs ? `${prijs} euro` : 'gratis') : String(prijs);\n    const hasRoute = P.routekaart ?? RP._routekaart_ingestuurd;\n    const server = false;\n    const p3 = addDays(start, -2);\n    const phases = [\n      { id: 1, from: d('2026-10-01'), when: 'Vanaf 1 okt', title: 'Nieuwsgierig maken' },\n      { id: 2, from: d('2026-10-12'), when: 'Vanaf 12 okt', title: 'Naar buiten' },\n      { id: 3, from: p3, when: `Vanaf ${p3.getDate()} okt`, title: 'Vlak voor de start' }\n    ];\n    let cur = 1; phases.forEach(p => { if (today >= p.from) cur = p.id; });\n    const sel = S.phase ?? cur;\n    const vals = { g, p: periode, s: startloc, l: RP._landingspagina, h: g };\n    const extra = (S.afzender || S.contact) ? `\\n\\n${S.afzender}${S.afzender && S.contact ? '\\n' : ''}${S.contact ? 'Vragen: ' + S.contact : ''}` : '';\n    const fill = (tpl) => tpl.replace('{x}', extra).replace(/\\{(\\w)\\}/g, (_, k) => vals[k]);\n    const segs = (tpl) => {\n      const out = []; const re = /\\{(\\w)\\}/g; let last = 0, m; tpl = tpl.replace('{x}', extra);\n      while ((m = re.exec(tpl))) { out.push({ plain: tpl.slice(last, m.index), mark: m[1] === 'h' ? '' : vals[m[1]] }); if (m[1] === 'h') out[out.length-1].plain += '#'.slice(1) + vals.h; last = re.lastIndex; }\n      out.push({ plain: tpl.slice(last), mark: '' }); return out;\n    };\n    const mkMsg = (id, kind) => {\n      const tpl = MSG[kind], text = fill(tpl);\n      const full = kind === 'hoplr' ? MSG.hoplrTitle + '\\n\\n' + text : text;\n      const c = S.copied === id, ct = S.copied === id + 't';\n      return {\n        segs: segs(tpl), isWa: kind === 'wa', isFb: kind === 'fb', isScholen: kind === 'scholen',\n        hasTitle: kind === 'hoplr', title: MSG.hoplrTitle,\n        wa: 'https://wa.me/?text=' + encodeURIComponent(text),\n        fb: 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(RP._landingspagina),\n        copy: () => this.copy(id, text), copyTitle: () => this.copy(id + 't', MSG.hoplrTitle),\n        copyLabel: c ? 'Gekopieerd ✓' : (kind === 'hoplr' ? 'Kopieer de tekst' : 'Kopieer de tekst'),\n        copyTitleLabel: ct ? 'Gekopieerd ✓' : 'Kopieer de titel',\n        copyBg: kind === 'wa' ? 'transparent' : (c ? '#13c7b5' : '#ffb52a'),\n        copyFg: kind === 'wa' ? '#fff' : '#07162f',\n        copyBorder: kind === 'wa' ? '1px solid rgba(255,255,255,.3)' : '0',\n        share: () => navigator.share?.({ text: full }).catch(() => {}),\n        afzender: S.afzender, contact: S.contact,\n        setAfzender: e => this.setState({ afzender: e.target.value }),\n        setContact: e => this.setState({ contact: e.target.value })\n      };\n    };\n    const TASKS = {\n      1: [\n        { id: 'druk', title: 'Maak jullie affiches en flyers', duur: S.druk === 'zelf' ? 'een uurtje aan de printer' : S.druk === 'drukker' ? 'een halfuur, daarna wachten op de drukker' : 'kies hieronder hoe', body: `Jullie datums, ${vp}${eigen ? ' en de ' + eigen.naam : ''} staan er al op. Ze moeten klaar zijn tegen 12 oktober.`,\n          choice: true,\n          steps: S.druk === 'drukker' ? [\n            'Download de drie drukbestanden hieronder.',\n            'Mail ze naar jullie drukker en zeg erbij: affiche op A3, flyer op A5 recto verso.',\n            'Vraag dat alles klaar is tegen 12 oktober.'\n          ] : S.druk === 'zelf' ? [\n            'Download de drie printbestanden hieronder.',\n            'Affiche: print op A3, of op A4 als jullie printer geen A3 kan.',\n            'Flyer: print voorkant en achterkant recto verso, twee per A4-blad, en snij ze doormidden.'\n          ] : [],\n          files: S.druk === 'drukker' ? [\n            { name: 'Affiche', meta: 'A3 · drukklare PDF met snijrand', thumb: 'beelden/affiche.jpg', href: 'beelden/affiche.jpg', download: `affiche-${g}-drukker.jpg` },\n            { name: 'Flyer voorkant', meta: 'A5 · drukklare PDF', thumb: 'beelden/flyer-voorkant.jpg', href: 'beelden/flyer-voorkant.jpg', download: `flyer-voorkant-${g}-drukker.jpg` },\n            { name: 'Flyer achterkant', meta: 'A5 · drukklare PDF', thumb: 'beelden/flyer-achterkant.jpg', href: 'beelden/flyer-achterkant.jpg', download: `flyer-achterkant-${g}-drukker.jpg` }\n          ] : S.druk === 'zelf' ? [\n            { name: 'Affiche', meta: 'A3 of A4 · PDF om zelf te printen', thumb: 'beelden/affiche.jpg', href: 'beelden/affiche.jpg', download: `affiche-${g}-print.jpg` },\n            { name: 'Flyer voorkant', meta: '2 per A4 · PDF', thumb: 'beelden/flyer-voorkant.jpg', href: 'beelden/flyer-voorkant.jpg', download: `flyer-voorkant-${g}-print.jpg` },\n            { name: 'Flyer achterkant', meta: '2 per A4 · PDF', thumb: 'beelden/flyer-achterkant.jpg', href: 'beelden/flyer-achterkant.jpg', download: `flyer-achterkant-${g}-print.jpg` }\n          ] : null },\n        { id: 'teaser', title: 'Hang de eerste affiches op', duur: '5 minuten, plus rondbrengen', body: 'Samen met de teaseraffiches die jullie ondersteuner brengt: in de vensters van leden, winkels en de bib.' },\n        { id: 'scholen', title: 'Bericht naar de gemeente en de scholen', duur: '10 minuten', body: 'Voor het gemeentelijk infoblad of een brief aan de ouders. Vul in wie het stuurt, de rest staat er al in.', msg: 'scholen' }\n      ],\n      2: [\n        { id: 'verspreid', title: 'Verspreid de affiches en flyers', duur: 'een namiddag met twee', body: `Winkels, de bib, openbare gebouwen: vraag altijd even of het mag. De flyers gaan in de bus in de straten rond ${vp}.` },\n        { id: 'social', title: 'Post op Facebook en Instagram', duur: '5 minuten', body: 'Instagram laat niet toe dat we e
