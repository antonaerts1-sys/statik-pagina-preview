<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:rgba(23,23,23,.7);
       font-family:"Radio Canada",system-ui,sans-serif;line-height:1.55}
  .site{max-width:1180px;margin:0 auto;padding:0 12px}
  .kop{padding:26px 0 0}
  .kop .titel{font-size:clamp(34px,5vw,57.8px);line-height:1.1;font-weight:700;color:#171717;margin:0}
  .kop .tagline{margin:2px 0 0;font-size:15px}
  .scheiding{border:0;border-top:1px solid rgba(23,23,23,.12);margin:18px 0 0}
  .terug{width:100%;margin:0 0 6px;padding:0 2px}
  .terug a{display:inline-block;padding:8px 0;color:rgba(23,23,23,.7);
           text-decoration:none;font-size:.95rem;line-height:1.3}
  .terug a:hover{text-decoration:underline}
  .proef{display:inline-block;margin:0 0 14px;padding:7px 14px;border-radius:999px;
         background:#FFCE00;color:#171717;font-size:13px;font-weight:700}
  iframe{display:block;width:100%;border:0;overflow:hidden}
  .voet{padding:26px 0 40px;border-top:1px solid rgba(23,23,23,.12);
        margin-top:8px;font-size:13px;color:rgba(23,23,23,.6)}
  .voet a{color:inherit}
</style></head><body>
<div class="site">
  <div class="kop"><p class="titel">Raak vzw</p><p class="tagline">Beleef meer</p></div>
  <hr class="scheiding">
  <div class="terug"><a href="https://raakvzw.be/ga-je-mee-op-griezeltocht/">&larr; Alle griezeltochten</a></div>
  <span class="proef">Voorbeeld, nog niet in gebruik</span>
</div>

<iframe id="pagina" src="pagina.html" title="Materialen voor Raak Hamme H. Hart" scrolling="no" height="3200"></iframe>

<div class="site"><div class="voet">
  Raak vzw &middot; Bibber in je Buurt 2026<br>
  Vragen over het materiaal? Mail <a href="mailto:info@raakvzw.be">info@raakvzw.be</a> of bel 02 246 52 52.
</div></div>

<script>
(function(){
  var f = document.getElementById('pagina');
  function meet(){
    try{
      var d = f.contentDocument;
      if(!d || !d.body) return;
      var h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
      if(h > 200) f.style.height = h + 'px';
    }catch(e){}
  }
  f.addEventListener('load', function(){
    meet();
    var n = 0, t = setInterval(function(){ meet(); if(++n > 60) clearInterval(t); }, 250);
    try{ new ResizeObserver(meet).observe(f.contentDocument.documentElement); }catch(e){}
  });
  window.addEventListener('resize', meet);
})();
</script>
</body></html>
